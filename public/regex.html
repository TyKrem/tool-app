  <meta charset="utf-8">

<title>正则工具 · 工具汇总</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%230b63ce' d='M8 3h2v8h4V3h2v10H2V3h2v8h2zM2 15h12v2H2zM2 19h20v2H2zM16 3h6v2h-4v2h3v2h-3v2h4v2h-6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css?v=20261003-theme">
<link rel="stylesheet" href="/theme.css?v=20261003-theme">
</head>
<body>
  <header class="topbar">
    <a class="brand home-link" href="/">
      <span class="brand-icon" aria-hidden="true">◇</span>
      <span class="brand-name">工具汇总</span>
    </a>
    <nav class="page-nav" aria-label="工具导航">
      <a href="/text.html">文本工具</a>
      <a href="/json.html">JSON 工具</a>
      <span class="current" aria-current="page">正则工具</span>
      <a href="/diff.html">Diff 对比</a>
      <a href="/math.html">数学工具</a>
      <a href="/string.html">字符串工具</a>
      <a href="/timestamp.html">时间戳工具</a>
    </nav>
    <nav class="sites">
      <a href="https://tykrem.top/">服务器监控</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel active">
      <div class="panel-head">
        <h1>正则工具</h1>
        <p class="desc">输入正则表达式和文本，列出全部匹配的位置与内容，并在下方高亮预览命中片段。支持常用模板、捕获组与 Unicode；全局匹配在独立线程执行，超时自动停止。</p>
      </div>

      <div class="card toolbar-card">
        <div class="mode-group regex-pattern-group">
          <span class="mode-label">表达式</span>
          <input id="regex-pattern" class="regex-input" type="text" spellcheck="false" autocomplete="off" placeholder="例如：\d+ 或 (https?)://[^\s]+">
        </div>
        <div class="regex-flags" role="group" aria-label="正则标记">
          <label><input type="checkbox" value="i"> i 忽略大小写</label>
          <label><input type="checkbox" value="m"> m 多行</label>
          <label><input type="checkbox" value="s"> s 单行(.匹配换行)</label>
          <label><input type="checkbox" value="u"> u Unicode</label>
        </div>
        <label class="preset-label">模板 <select id="regex-preset" class="select" aria-label="常用正则模板"><option value="">自定义</option><option value="number">数字</option><option value="email">邮箱</option><option value="url">网址</option><option value="chinese">中文</option></select></label>
        <div class="toolbar-actions">
          <button class="btn primary" id="regex-execute" type="button">匹配</button>
          <button class="btn" id="regex-clear" type="button">清空</button>
        </div>
      </div>

      <div class="text-grid regex-grid">
        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">A 文本</span>
            <span class="ed-hint" id="regex-text-hint">输入要匹配的文本</span>
            <button class="btn small" id="regex-text-clear" type="button">清空</button>
          </div>
          <div id="regex-text" class="editor"></div>
        </div>

        <div class="card editor-card regex-result-card">
          <div class="ed-head">
            <span class="ed-name">匹配结果</span>
            <span class="ed-hint" id="regex-result-hint">等待执行</span>
            <button class="btn small" id="regex-copy" type="button" disabled>复制全部匹配</button>
          </div>
          <div class="regex-result" id="regex-result">
            <div class="regex-empty" id="regex-empty">点击“匹配”查看全部结果</div>
            <div class="regex-error hidden" id="regex-error"></div>
            <div class="regex-list hidden" id="regex-list"></div>
          </div>
        </div>

        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">高亮预览</span>
            <span class="ed-hint" id="regex-preview-hint">匹配处会用底色标出</span>
          </div>
          <div class="regex-preview" id="regex-preview">
            <span class="regex-empty">匹配后这里会按原文高亮显示命中的内容</span>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/js/common.js?v=20261003a"></script>
  <script src="/js/regex.js?v=20261003a"></script>
</body>
</html>
