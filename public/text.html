  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>文本工具 · 工具汇总</title>

  <link rel="stylesheet" href="/css/style.css?v=20261003-theme">
<link rel="stylesheet" href="/theme.css?v=20261003-theme">
</head>
<body>
  <header class="topbar">
    <a class="brand home-link" href="/">
      <span class="brand-icon" aria-hidden="true">◇</span>
      <span class="brand-name">工具汇总</span>
    </a>
    <nav class="page-nav" aria-label="工具导航">
      <span class="current" aria-current="page">文本工具</span>
      <a href="/json.html">JSON 工具</a>
      <a href="/regex.html">正则工具</a>
      <a href="/diff.html">Diff 对比</a>
      <a href="/math.html">数学工具</a>
      <a href="/string.html">字符串工具</a>
      <a href="/timestamp.html">时间戳工具</a>
    </nav>
    <nav class="sites">
      <a href="https://tykrem.top/">服务器监控</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel active">
      <div class="panel-head">
        <h1>文本工具</h1>
        <p class="desc">按行去重、合并或找差异。保留原顺序，可选择去掉首尾空白、过滤空行、排序；Ctrl / ⌘ + Enter 执行。</p>
      </div>

      <div class="card toolbar-card">
        <div class="mode-group" role="group" aria-label="模式">
          <span class="mode-label">模式</span>
          <div class="seg" id="text-mode-seg">
            <button class="seg-btn active" type="button" data-mode="dedupe">去重</button>
            <button class="seg-btn" type="button" data-mode="intersect">交集</button>
            <button class="seg-btn" type="button" data-mode="union">并集</button>
            <button class="seg-btn" type="button" data-mode="subtract">A − B</button>
            <button class="seg-btn" type="button" data-mode="reverseSubtract">B − A</button>
          </div>
        </div>
        <label class="check-line"><input id="text-trim" type="checkbox">去首尾空白</label>
        <label class="check-line"><input id="text-empty" type="checkbox">过滤空行</label>
        <label class="check-line"><input id="text-sort" type="checkbox">排序</label>
        <div class="toolbar-actions">
          <button class="btn" id="text-swap" type="button">交换 A / B</button>
          <button class="btn primary" id="text-execute" type="button">执行</button>
          <button class="btn" id="text-clear" type="button">清空</button>
        </div>
      </div>

      <div class="text-grid">
        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">A 输入</span>
            <span class="ed-hint" id="hintA"></span>
          </div>
          <div id="editorA" class="editor" data-kind="A"></div>
        </div>

        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">B 输入</span>
            <span class="ed-hint" id="hintB"></span>
          </div>
          <div id="editorB" class="editor" data-kind="B"></div>
        </div>

        <div class="card editor-card output-card">
          <div class="ed-head">
            <span class="ed-name">C 输出 <em class="readonly-tag">只读</em></span>
            <span class="ed-hint" id="hintC">点击“执行”后生成</span>
            <button class="btn small" id="text-copy" type="button" disabled>复制 C</button>
          </div>
          <div id="editorC" class="editor output" data-kind="C"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <script src="/js/common.js?v=20261003a"></script>
  <script src="/js/text-core.js?v=20261003a"></script>
  <script src="/js/text.js?v=20261003a"></script>
</body>
</html>
