<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>文本工具 · 工具汇总</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%2338bdf8' d='M8 3h2v8h4V3h2v10H2V3h2v8h2zM2 15h12v2H2zM2 19h20v2H2zM16 3h6v2h-4v2h3v2h-3v2h4v2h-6z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/style.css?v=20260904c">
</head>
<body>
  <header class="topbar">
    <a class="brand home-link" href="/">
      <span class="brand-icon">&#128736;</span>
      <span class="brand-name">工具汇总</span>
    </a>
    <nav class="page-nav">
      <span class="current">文本工具</span>
      <a href="/json.html">JSON 工具</a>
      <a href="/regex.html">正则工具</a>
    </nav>
    <nav class="sites">
      <a href="https://chat.tykrem.top/">Codex Chat</a>
      <a href="https://tykrem.top/">服务器监控</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel active">
      <div class="panel-head">
        <h1>文本工具</h1>
        <p class="desc">按行处理：去重 / 交集 / 并集。去重高亮 A 中重复行，交集高亮 A、B 中相同行；行号与高亮实时显示，C 为只读结果。</p>
      </div>

      <div class="card toolbar-card">
        <div class="mode-group" role="group" aria-label="模式">
          <span class="mode-label">模式</span>
          <div class="seg" id="text-mode-seg">
            <button class="seg-btn active" type="button" data-mode="dedupe">去重</button>
            <button class="seg-btn" type="button" data-mode="intersect">交集</button>
            <button class="seg-btn" type="button" data-mode="union">并集</button>
          </div>
        </div>
        <div class="toolbar-actions">
          <button class="btn primary" id="text-execute" type="button">执行</button>
          <button class="btn" id="text-clear" type="button">清空</button>
        </div>
      </div>

      <div class="text-grid">
        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">A 输入</span>
            <span class="ed-hint" id="hintA"></span>
          </div>
          <div id="editorA" class="editor" data-kind="A"></div>
        </div>

        <div class="card editor-card">
          <div class="ed-head">
            <span class="ed-name">B 输入</span>
            <span class="ed-hint" id="hintB"></span>
          </div>
          <div id="editorB" class="editor" data-kind="B"></div>
        </div>

        <div class="card editor-card output-card">
          <div class="ed-head">
            <span class="ed-name">C 输出 <em class="readonly-tag">只读</em></span>
            <span class="ed-hint" id="hintC">点击“执行”后生成</span>
            <button class="btn small" id="text-copy" type="button">复制 C</button>
          </div>
          <div id="editorC" class="editor output" data-kind="C"></div>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast hidden" role="status"></div>
  <div class="mobile-block">
    <div class="mobile-card">
      <p class="mobile-emoji">📱</p>
      <h2>不支持移动端</h2>
      <p>当前页面暂不支持移动端，请使用电脑浏览器访问。</p>
    </div>
  </div>
  <script src="/js/common.js"></script>
  <script src="/js/text.js"></script>
</body>
</html>
